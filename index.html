<!-- JS -->
<script>
/* Loader */
window.addEventListener("load", () => {
  const loader = document.getElementById("loader");
  loader.style.opacity = "0";
  setTimeout(() => {
    loader.style.display = "none";
  }, 500);
});

// Sécurité : au cas où une image bloque
setTimeout(() => {
  const loader = document.getElementById("loader");
  if (loader) loader.style.display = "none";
}, 4000);


/* Slider optimisé */
const slides = document.querySelectorAll(".slide");
let index = 0;
let sliderInterval;

function startSlider(){
  sliderInterval = setInterval(() => {
    slides[index].classList.remove("active");
    index = (index + 1) % slides.length;
    slides[index].classList.add("active");
  }, 4000);
}

function stopSlider(){
  clearInterval(sliderInterval);
}

document.addEventListener("visibilitychange", () => {
  if(document.hidden){
    stopSlider();
  }else{
    startSlider();
  }
});

startSlider();


/* WhatsApp */
document.getElementById("transactionForm").addEventListener("submit", function(e){
  e.preventDefault();

  const message =
`TransBetCash
Site : ${site.value}
Compte : ${compte.value}
Opération : ${type.value}
Montant : ${montant.value} FCFA
Paiement : ${paiement.value}`;

// ✅ FEEDBACK VISUEL (SANS CRASH)
  const feedback = document.getElementById("whatsapp-feedback");
  if (feedback) feedback.style.display = "block";

  setTimeout(() => {
    window.open(
      "https://wa.me/22962003165?text=" + encodeURIComponent(message),
      "_blank"
    );
  }, 600);
});

  

/* PWA */
let deferredPrompt;
const installBtn = document.getElementById("installBtn");

window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  deferredPrompt = e;
  installBtn.style.display = "block";
});

installBtn.addEventListener("click", () => {
  deferredPrompt.prompt();
});
</script>
